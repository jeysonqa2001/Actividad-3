<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{% endblock %} | Mi Proyecto</title>
  <script>
    try {
      var t = localStorage.getItem("tema");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
  <header class="header">
    <h1 class="logo">Mi Proyecto</h1>
    <nav class="menu">
      <a href="{{ url_for('inicio') }}">Inicio</a>
      <a href="{{ url_for('estudiantes') }}">Estudiantes</a>
      <a href="{{ url_for('contacto') }}">Contacto</a>
    </nav>
    <button id="btnTema" class="btn-tema" type="button"></button>
  </header>

  <main>
    {% block contenido %}{% endblock %}
  </main>

  <footer class="footer">
    <p>&copy; 2026 Mi Proyecto</p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
